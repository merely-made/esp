[package]
rust-version = "1.97.1"
name = "esp"
version = "0.1.0"
edition = "2024"
description = "Portable inference and embedding seams for local, browser, and remote model execution."
repository = "https://github.com/merely-made/esp"
readme = "README.md"
keywords = [
    "inference",
    "embeddings",
    "local",
    "webgpu",
    "retrieval",
]
categories = [
    "science",
    "api-bindings",
    "data-structures",
]

[package.license]
workspace = true

[dependencies]
zeroize = "1"

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.eidetic]
workspace = true
optional = true

[dependencies.armillary]
workspace = true
optional = true

[dependencies.burn]
version = "=0.22.0"
default-features = false
features = [
    "ndarray",
    "std",
]
optional = true

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.safetensors]
version = "0.4"
optional = true

[dependencies.half]
version = "2"
optional = true

[dependencies.wgpu]
workspace = true
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

[target."cfg(not(all(target_family = \"wasm\", target_os = \"unknown\")))".dependencies.tokenizers]
version = "0.20"
default-features = false
features = [
    "onig",
]
optional = true

[target."cfg(all(target_family = \"wasm\", target_os = \"unknown\"))".dependencies.tokenizers]
version = "0.20"
default-features = false
features = [
    "unstable_wasm",
]
optional = true

[target."cfg(all(target_family = \"wasm\", target_os = \"unknown\"))".dependencies.getrandom]
version = "0.4"
features = [
    "wasm_js",
]
optional = true

[dev-dependencies]
serde_json = "1"
pollster = "0.4"
async-trait = "0.1"
tempfile = "3"

[dev-dependencies.eidetic]
workspace = true

[dev-dependencies.muniment]
workspace = true
features = [
    "redb",
]

[dev-dependencies.sha2]
workspace = true

[features]
default = []
actor = [
    "dep:armillary",
]
decoder = [
    "dep:burn",
    "dep:serde_json",
    "dep:safetensors",
    "dep:half",
    "dep:tokenizers",
    "dep:tracing",
    "dep:getrandom",
]
decoder-flex = [
    "decoder",
    "burn/flex",
]
decoder-wgpu = [
    "decoder",
    "burn/wgpu",
    "dep:wgpu",
    "dep:pollster",
]
decoder-lora = [
    "decoder",
    "model-session",
]
decoder-autodiff = [
    "decoder-lora",
    "burn/autodiff",
    "burn/optim",
]
persistence = [
    "dep:eidetic",
]
model-session = [
    "persistence",
    "dep:serde_json",
]
index-burn = [
    "dep:burn",
    "dep:getrandom",
]
index-burn-wgpu = [
    "index-burn",
    "burn/wgpu",
]
bert = [
    "dep:burn",
    "dep:tokenizers",
    "dep:safetensors",
    "dep:serde_json",
    "dep:half",
    "dep:getrandom",
]
bert-wgpu = [
    "bert",
    "burn/wgpu",
]
bert-validation = [
    "bert",
]

[[example]]
name = "import_inference_model"
required-features = [
    "decoder",
    "model-session",
]

[[example]]
name = "qualify_inference_model"
required-features = [
    "decoder",
    "model-session",
]

[[test]]
name = "library_session"
required-features = [
    "decoder",
    "model-session",
]

[[test]]
name = "smollm2_library"
required-features = [
    "decoder",
    "model-session",
]
