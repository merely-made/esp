[package]
name = "esp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Portable inference and embedding seams for local, browser, and remote model execution."
repository = "https://github.com/merely-made/mere"
readme = "README.md"
keywords = ["inference", "embeddings", "local", "webgpu", "retrieval"]
categories = ["science", "api-bindings", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }

# Typed-payload persistence for `embed::VectorIndex` (2026-08-12 eidetic
# reorg). Optional, so the default tree stays serde-only and portable: a
# consumer that only computes embeddings never links the store.
eidetic = { package = "mere-eidetic", path = "../../eidetic/eidetic-core", version = "0.0.1", optional = true }

# Inference actor. Optional so the default seam remains thread-free.
armillary = { path = "../../armillary", version = "0.1.0", optional = true }

# Shared model tree. NdArray is the portable baseline; the `-wgpu` features add
# Burn's WebGPU backend without changing the model bodies.
burn = { version = "0.21", default-features = false, features = ["ndarray", "std"], optional = true }
tracing = { version = "0.1", optional = true }
serde_json = { version = "1.0", optional = true }
safetensors = { version = "0.4", optional = true }
half = { version = "2", optional = true }

# Tokenizers uses native Oniguruma on native targets and the pure-Rust regex
# path on wasm. The dependency name is shared so `dep:tokenizers` activates the
# appropriate target realization.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
tokenizers = { version = "0.20", default-features = false, features = ["unstable_wasm"], optional = true }
# Burn's tree reaches getrandom 0.4 even through the NdArray configurations;
# wasm therefore needs the JS backend selected by every ESP Burn feature.
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[dev-dependencies]
serde_json = "1"
pollster = "0.4"
async-trait = "0.1"
eidetic = { package = "mere-eidetic", path = "../../eidetic/eidetic-core", version = "0.0.1" }
muniment = { path = "../../eidetic/muniment", version = "0.1.1" }

[features]
default = []

# esp::infer
actor = ["dep:armillary"]
decoder = ["dep:burn", "dep:serde_json", "dep:safetensors", "dep:half", "dep:tokenizers", "dep:tracing", "dep:getrandom"]
decoder-wgpu = ["decoder", "burn/wgpu"]

# esp::embed
# Save/load a VectorIndex through eidetic's typed-payload API.
persistence = ["dep:eidetic"]
index-burn = ["dep:burn", "dep:getrandom"]
index-burn-wgpu = ["index-burn", "burn/wgpu"]
bert = ["dep:burn", "dep:tokenizers", "dep:safetensors", "dep:serde_json", "dep:getrandom"]
bert-wgpu = ["bert", "burn/wgpu"]
bert-validation = ["bert"]
