[workspace]
resolver = "2"
members = [
    "crates/esp",
    "crates/esp-test-support",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/esp"
authors = [
    "Mark AB (markik)",
]

[workspace.dependencies]
wgpu = "30.0.1"
sha2 = "0.11"

[workspace.dependencies.eidetic]
version = "0.0.2"
git = "https://github.com/merely-made/eidetic.git"
rev = "44f0664748238d7a96603925a0268caf60e091aa"

[workspace.dependencies.armillary]
version = "0.1.0"
git = "https://github.com/merely-made/armillary.git"
rev = "92d5b15cf39aaac40a3f2d863ffee69c9be11bfc"

[workspace.dependencies.muniment]
version = "0.1.1"
git = "https://github.com/merely-made/eidetic.git"
rev = "44f0664748238d7a96603925a0268caf60e091aa"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[patch."https://github.com/merely-made/esp.git".esp]
path = "crates/esp"

[patch.crates-io.muniment]
git = "https://github.com/merely-made/eidetic.git"
rev = "44f0664748238d7a96603925a0268caf60e091aa"
