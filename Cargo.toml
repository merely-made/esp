[workspace]
resolver = "2"
members = [
    "crates/esp",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/esp"
authors = [
    "Mark AB (markik)",
]

[workspace.dependencies]
wgpu = "30.0.1"
sha2 = "0.11"

[workspace.dependencies.eidetic]
version = "0.0.2"
git = "https://github.com/merely-made/eidetic.git"
rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943"

[workspace.dependencies.armillary]
version = "0.1.0"
git = "https://github.com/merely-made/armillary.git"
rev = "5d8754dc2a00be02d82b075441ac9ea44aa4f135"

[workspace.dependencies.muniment]
version = "0.1.1"
git = "https://github.com/merely-made/eidetic.git"
rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[patch."https://github.com/merely-made/esp.git".esp]
path = "crates/esp"

[patch.crates-io.muniment]
git = "https://github.com/merely-made/eidetic.git"
rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943"
